<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-labelledby="title desc">
  <title id="title">Tablekind</title>
  <desc id="desc">Restaurant ordering and shared bills. One table, individual orders, exact shares. A Java and React portfolio prototype with TEST payment and POS adapters.</desc>
  <defs>
