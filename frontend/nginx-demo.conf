# Tailscale terminates HTTPS, then proxies only this web server.
limit_req_zone $binary_remote_addr zone=demo_login:1m rate=6r/m;
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control 'no-store' always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /api/auth/login {
    # The reverse proxy shares an address; this limit is deliberately sized for two reviewers.
    limit_req zone=demo_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }
  location ~ ^/(actuator|swagger-ui|v3/api-docs)(/|$|\.) { return 404; }
  location ~ /\. { return 404; }
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 75s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
